[project]
name = "moto-blur"
version = "0.1.0"
description = "Floutage automatique (visages, plaques) et montage simple pour vidéos moto. Traitement 100 % local."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "av>=19,<20",
    "numpy>=2",
    "opencv-python-headless>=4.10",
    # Conversion locale des modèles de plaques pour traiter les tuiles par lot.
    "onnx>=1.16",
    # Windows : DirectML (GPU AMD/Intel/Nvidia). Dernière version publiée du paquet : 1.24.4.
    "onnxruntime-directml==1.24.4; sys_platform == 'win32'",
    # macOS (CoreML inclus) et Linux (CPU).
    "onnxruntime>=1.24; sys_platform != 'win32'",
]

[project.scripts]
moto-blur = "moto_blur.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moto_blur"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
