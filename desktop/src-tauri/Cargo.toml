[package]
name = "flouto-desktop"
version = "0.1.0"
description = "Flouto : floutage automatique et montage simple de vidéos"
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "flouto_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"

[profile.release]
strip = true
opt-level = "s"
