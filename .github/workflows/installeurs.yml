name: Installeurs

# Fabrique l'application de bureau pour macOS (Apple Silicon) et Windows.
#
# - Étiquette de version (v0.2.0…) : publie une version sur la page « Releases » du dépôt, avec
#   l'installeur Windows (.exe), l'image Mac (.dmg) et le fichier que l'application consulte
#   pour proposer ses mises à jour (latest.json). Les paquets de mise à jour sont signés avec la
#   clé du secret TAURI_SIGNING_PRIVATE_KEY.
# - Lancement manuel (onglet Actions) : fabrique les installeurs sans rien publier ; ils sont
#   téléchargeables en bas de la page de l'exécution, section « Artifacts ».
#
# Rien ne se fabrique plus à chaque modification : chaque fabrication consomme des minutes de
# GitHub Actions (celles de macOS comptent dix fois).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  application:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      - name: Clé de signature des mises à jour
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Le secret TAURI_SIGNING_PRIVATE_KEY manque (Settings > Secrets and variables > Actions). Voir TUTORIEL.md, section 9."
            exit 1
          fi

      - name: Numéro de version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const f='desktop/src-tauri/tauri.conf.json',fs=require('fs');const c=JSON.parse(fs.readFileSync(f));c.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')" "$VERSION"
          echo "Version $VERSION"

      - name: Interface web
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Moteur autonome (PyInstaller)
        shell: bash
        run: |
          uv sync --no-dev
          uv run --with pyinstaller pyinstaller desktop/engine.spec --distpath desktop/engine-dist --workpath desktop/engine-build -y
          ./desktop/engine-dist/moto-blur-engine/moto-blur-engine info

      # Essai réel du moteur sur ce système : accélération (CoreML, DirectML), encodeur retenu,
      # suivi du compteur. Informatif : un échec ici n'empêche pas de produire l'installeur.
      - name: Essai du moteur
        shell: bash
        continue-on-error: true
        run: |
          uv run python desktop/make_sample.py essai.mp4
          ENGINE=./desktop/engine-dist/moto-blur-engine/moto-blur-engine
          $ENGINE probe essai.mp4
          $ENGINE run essai.mp4 -o essai_floute.mp4 --keep 0-1
          $ENGINE dash essai.motoblur.json --at 0.2 --box 300,400,400,120
          $ENGINE render essai.motoblur.json -o essai_hevc.mp4 --codec hevc
          $ENGINE probe essai_floute.mp4 essai_hevc.mp4

      - name: Dépendances de l'application
        working-directory: desktop
        run: npm ci

      - name: Publication de la version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: moto-blur ${{ github.ref_name }}
          releaseBody: |
            **Windows** : téléchargez le fichier `.exe` ci-dessous et lancez-le. Si Windows affiche « Windows a protégé votre ordinateur », cliquez « Informations complémentaires », puis « Exécuter quand même ».

            **Mac (puce Apple)** : téléchargez le fichier `.dmg`, ouvrez-le et glissez moto-blur dans Applications. Au premier lancement, ouvrez Réglages Système > Confidentialité et sécurité et cliquez « Ouvrir quand même ». Si macOS dit que l'application est « endommagée », tapez dans le Terminal : `xattr -cr /Applications/moto-blur.app`

            Une fois installé, moto-blur propose lui-même les versions suivantes au démarrage.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Installeurs (sans publication)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: desktop
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: moto-blur-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
