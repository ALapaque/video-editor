name: Installeurs

# Fabrique l'application de bureau pour macOS (Apple Silicon) et Windows, et la publie.
#
# - Fusion dans main (si l'application, le moteur ou l'interface ont changé) : nouvelle version
#   publiée automatiquement. Numéro : le dernier v… publié, dernier chiffre + 1 (v0.0.1, v0.0.2…).
#   Pour changer de numéro (v0.1.0, v1.0.0…), pousser soi-même l'étiquette voulue : la suite
#   repartira de là.
# - Étiquette de version poussée à la main (v0.3.0…) : publie cette version.
# - Lancement manuel (onglet Actions, « Run workflow ») : fabrique les installeurs sans rien
#   publier ; ils sont dans « Artifacts », en bas de la page de l'exécution.
#
# Une version est d'abord préparée en brouillon ; elle n'est publiée (et proposée en mise à
# jour aux applications installées) que si Windows ET macOS ont réussi.
# Les paquets de mise à jour sont signés avec le secret TAURI_SIGNING_PRIVATE_KEY.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "ui/src/**"
      - "desktop/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/installeurs.yml"

permissions:
  contents: write

# Deux fusions rapprochées : les versions se suivent, elles ne se chevauchent pas.
concurrency:
  group: installeurs
  cancel-in-progress: false

jobs:
  preparation:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.brouillon.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Numéro de version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PUBLISH=true
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            LAST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
            if [ -z "$LAST" ]; then
              VERSION=0.0.1
            else
              IFS=. read -r MAJ MIN PAT <<< "${LAST#v}"
              VERSION="$MAJ.$MIN.$((PAT + 1))"
            fi
            PUBLISH=true
          else
            VERSION=0.0.0
            PUBLISH=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Version : $VERSION (publication : $PUBLISH)"

      - name: Clé de signature des mises à jour
        if: steps.version.outputs.publish == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Le secret TAURI_SIGNING_PRIVATE_KEY manque (Settings > Secrets and variables > Actions). Voir TUTORIEL.md, section 9."
            exit 1
          fi

      - name: Version en brouillon
        id: brouillon
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        shell: bash
        run: |
          # Les brouillons laissés par des fabrications ratées sont supprimés (seul ce workflow en
          # crée, et deux exécutions ne se chevauchent pas).
          OLD=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.draft) | .id")
          for id in $OLD; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          cat > notes.md <<'NOTES'
          **Windows** : téléchargez le fichier qui finit par `_x64-setup.exe` ci-dessous et lancez-le. Si Windows affiche « Windows a protégé votre ordinateur », cliquez « Informations complémentaires », puis « Exécuter quand même ».

          **Mac (puce Apple)** : téléchargez le fichier `.dmg`, ouvrez-le et glissez moto-blur dans Applications. Au premier lancement, ouvrez Réglages Système > Confidentialité et sécurité et cliquez « Ouvrir quand même ». Si macOS dit que l'application est « endommagée », tapez dans le Terminal : `xattr -cr /Applications/moto-blur.app`

          Une fois installé, moto-blur propose lui-même les versions suivantes au démarrage.
          NOTES
          sed -i 's/^          //' notes.md
          # L'identifiant est pris dans la réponse de la création : relire la liste juste après
          # ne le montre pas toujours encore.
          ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
            -f name="moto-blur $TAG" -F body=@notes.md -F draft=true --jq '.id')
          if [ -z "$ID" ]; then
            echo "::error::Le brouillon de la version $TAG n'a pas pu être créé."
            exit 1
          fi
          echo "Brouillon $TAG : $ID"
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"

  application:
    needs: preparation
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      - name: Numéro de version
        if: needs.preparation.outputs.publish == 'true'
        shell: bash
        run: |
          node -e "const f='desktop/src-tauri/tauri.conf.json',fs=require('fs');const c=JSON.parse(fs.readFileSync(f));c.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')" "${{ needs.preparation.outputs.version }}"

      - name: Interface web
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Moteur autonome (PyInstaller)
        shell: bash
        run: |
          uv sync --no-dev
          uv run --with pyinstaller pyinstaller desktop/engine.spec --distpath desktop/engine-dist --workpath desktop/engine-build -y
          ./desktop/engine-dist/moto-blur-engine/moto-blur-engine info

      # Essai réel du moteur sur ce système : accélération (CoreML, DirectML), encodeur retenu,
      # suivi du compteur. Informatif : un échec ici n'empêche pas de produire l'installeur.
      - name: Essai du moteur
        shell: bash
        continue-on-error: true
        run: |
          uv run python desktop/make_sample.py essai.mp4
          ENGINE=./desktop/engine-dist/moto-blur-engine/moto-blur-engine
          $ENGINE probe essai.mp4
          $ENGINE run essai.mp4 -o essai_floute.mp4 --keep 0-1
          $ENGINE dash essai.motoblur.json --at 0.2 --box 300,400,400,120
          $ENGINE render essai.motoblur.json -o essai_hevc.mp4 --codec hevc
          $ENGINE probe essai_floute.mp4 essai_hevc.mp4

      - name: Dépendances de l'application
        working-directory: desktop
        run: npm ci

      - name: Identifiant du brouillon
        if: needs.preparation.outputs.publish == 'true'
        shell: bash
        run: |
          if [ -z "${{ needs.preparation.outputs.release_id }}" ]; then
            echo "::error::Identifiant du brouillon de version manquant : les installeurs n'auraient été déposés nulle part."
            exit 1
          fi

      - name: Installeurs ajoutés à la version
        if: needs.preparation.outputs.publish == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.preparation.outputs.release_id }}
          includeUpdaterJson: true

      - name: Installeurs (sans publication)
        if: needs.preparation.outputs.publish != 'true'
        working-directory: desktop
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        if: needs.preparation.outputs.publish != 'true'
        with:
          name: moto-blur-${{ matrix.os }}
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  publication:
    needs: [preparation, application]
    if: needs.preparation.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publication de la version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          ID="${{ needs.preparation.outputs.release_id }}"
          # Une version n'est publiée que si l'installeur Windows, l'image Mac et le fichier des
          # mises à jour y sont bien.
          ASSETS=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --paginate --jq '.[].name')
          echo "$ASSETS"
          for want in '_x64-setup.exe$' '_x64-setup.exe.sig$' '\.dmg$' '\.app\.tar\.gz$' '\.app\.tar\.gz\.sig$' '^latest\.json$'; do
            echo "$ASSETS" | grep -Eq "$want" || { echo "::error::Fichier manquant dans la version : $want"; exit 1; }
          done
          # Le fichier des mises à jour doit connaître Windows ET le Mac.
          ASSET=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --paginate --jq '.[] | select(.name == "latest.json") | .id')
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET" -H "Accept: application/octet-stream" > latest.json
          cat latest.json
          for platform in windows-x86_64 darwin-aarch64; do
            jq -e --arg p "$platform" '.platforms[$p].signature | length > 0' latest.json >/dev/null \
              || { echo "::error::$platform absent du fichier des mises à jour"; exit 1; }
          done
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f make_latest=true --jq '.html_url'
