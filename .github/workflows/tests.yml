name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  moteur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      # Les tests téléchargent quelques modèles (dont celui du contour précis, 155 Mo) : on les garde.
      - uses: actions/cache@v4
        with:
          path: ~/.moto-blur/models
          key: modeles-${{ hashFiles('src/moto_blur/models.py', 'src/moto_blur/contour.py') }}
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui

  # L'application de bureau compile-t-elle ? Attrape avant la fusion ce qui ferait échouer la
  # fabrication des installeurs (qui n'a lieu qu'à la publication d'une version).
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Bibliothèques système de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Compilation de l'application
        working-directory: desktop/src-tauri
        run: |
          # Le moteur autonome n'est fabriqué qu'avec les installeurs : un dossier vide suffit
          # ici, la configuration exigeant seulement qu'il existe.
          mkdir -p ../engine-dist/moto-blur-engine
          cargo check --locked
