name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  moteur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run pytest -q

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
